name: uptime

# 从 GitHub 机房盯煋鉴官网：每 5 分钟探一次首页 / 健康接口 / 登录页。
# 连续三轮都失败才判定故障——跨洋链路会抖，一次失败不算数。
# 判定故障后开一张单并 @ 人，GitHub 会立刻把邮件发到被 @ 的人手上。
#
# 为什么用开单而不是发邮件：邮件要 SMTP 凭据 -> 要 Secrets -> 要登录网页设。
# 开单只用 workflow 自带的临时令牌，零额外凭据。而且单子有案可查。

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/uptime.yml'
      - '.github/scripts/probe.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 探测官网，出事就开单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_MENTION: HDY-Ezio
          PROBE_BASE: https://xinpect-probe-drill.invalid
          ALERT_NOTE: 本次是演练：故意把探测地址指向不存在的域名，用来验证「真出事时能不能叫醒人」。官网本身正常，不用处理，我会自动关掉这张单。
        run: python3 .github/scripts/probe.py
