name: uptime

# 从 GitHub 机房盯煋鉴官网：每 15 分钟探一次首页 / 健康接口 / 登录页。
# 连续三轮都失败才判定故障——跨洋链路会抖，一次失败不算数。
# 判定故障后开一张单并 @ 人，GitHub 会立刻把邮件发到被 @ 的人手上。
#
# 为什么用开单而不是发邮件：邮件要 SMTP 凭据 -> 要 Secrets -> 要登录网页设。
# 开单只用 workflow 自带的临时令牌，零额外凭据。而且单子有案可查。
#
# 为什么是 15 分钟而不是 5 分钟：GitHub 明文写着「频率过高的事件可能被整个丢弃」。
# 5 分钟实测跑了一次都没触发，15 分钟才排得上。宁可慢十分钟，不要一次都不跑。

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/uptime.yml'
      - '.github/scripts/probe.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 探测官网，出事就开单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_MENTION: HDY-Ezio
        run: python3 .github/scripts/probe.py
